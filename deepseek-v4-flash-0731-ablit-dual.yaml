# Keys abliterated DeepSeek-V4-Flash-0731 — TP=2 across spark + gigabyte over
# CX7 (1M ctx). Same engine, same shape, same hotfix suite as
# deepseek-v4-flash-0731-dual.yaml; only the checkpoint differs.
#
# Checkpoint: drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32
# (revision 6c47916f85e52b5e712223ca8f93952f90255714, 155.4 GiB, 48 shards) —
# the optional abliterated lane of the MiaAI-Lab recipe
# (`prepare-dspark-model-cache.sh --abliterated`, ABLITERATED=1). It is a
# refusal-direction ablation of official 0731, not a different architecture or
# quantization: config, tokenizer and `encoding/encoding_dsv4.py` are the
# checkpoint's own, so the bootstrap's encoder install works unchanged.
# Read the checkpoint's RESPONSIBLE_USE.md — safety refusals are removed by
# construction; this lane exists for local eval, not for serving to others.
#
# Upstream pins the abliterated variant to the tip of its branch
# (DSPARK_REVISION_ABLITERATED empty). We pin the commit instead, matching the
# official lane's 9e165c30 pin — a silent checkpoint swap under a served model
# name is not something to inherit.
#
# 2026-08-22: re-synced to upstream `main` @ 489af95 alongside the official
# lane — see deepseek-v4-flash-0731-dual.yaml's header for what that refresh
# contains (#109 empty-encoder patch, #66 opt-in thinking budget, #103/#108
# fail-closed patchers). The two lanes share one vendored patches directory and
# one bootstrap, so they cannot drift.
#
# The HF gate that blocked this recipe is cleared: the weights finished
# downloading to gigabyte on 2026-08-22 (48 shards, 156G) and the checkpoint's
# config.json is byte-identical to official 0731's. Never launched on this pair.
#
# Upstream's own audit measures this checkpoint on this exact profile:
# C1 decode 73.1 tok/s vs 75.5 for official (2x DGX Spark, Anemll 0.1.1,
# 2026-08-16). Nothing here has been benchmarked on this pair yet.
#
# Weights live ONCE on gigabyte at
# ~/models/drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32;
# spark reads them over the NFS mount. The image must be `docker pull`ed on
# BOTH nodes (it already is, shared with the official 0731 lane).
runtime: vllm-dual
image: "ghcr.io/anemll/dspark-vllm-gx10:0.1.1"
model: "drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32"
model_path: "~/models-gigabyte/drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32"
worker_model_path: "~/models/drowzeys/keys-DeepSeekV4-Flash-GA-0731-Dspark-Abliterated-32-32"
port: 8888
display_name: "DeepSeek-V4-Flash 0731 Abliterated 1M [DUAL 2x SPARK]"

# The image ENTRYPOINT is not `vllm serve`, and 0731 needs its own encoder
# installed into vLLM before import on both ranks — see the script header.
entrypoint: "/dspark-bootstrap.sh"

worker_host: Gigabyte
master_addr: 10.100.224.2
worker_ip: 10.100.224.1
master_port: 25000
nccl:
  ifname: enp1s0f1np1
  hca: rocep1s0f1
  gid_index: 3

ctx: 1048576
max_num_seqs: 6
# 0.80, not the 0.845 this recipe used before MTP went 3 -> 5: dropped to leave
# headroom for cudagraph capture at the larger capture size
# (max_num_seqs * (MTP + 1) = 36). The two move together — do not raise one
# without the other. No --kv-cache-memory-bytes: the profiler sizes the pool,
# which is how the 900K acceptance run was measured.
# Upstream tip serves 0.835 (~2.49M-token KV pool). We stay at 0.80 until a
# live KV-sizing run on this pair says otherwise: graph capture is the
# uncounted allocation that has hard-reset this box before, and the gap is
# pool size, not correctness.
gpu_memory_utilization: 0.80
# Load-bearing: lmswitch's `_vllm_args` defaults --enforce-eager ON (single-node
# convention). This profile's whole decode advantage is CUDA graphs.
enforce_eager: false
shm_size: 64g
# Cold FlashInfer autotune + 48-shard TP=2 load over NFS on first start.
ready_timeout: 3600

extra_mounts:
  - "~/utils/lmswitch/ai-models/scripts/dspark-0731-bootstrap.sh:/dspark-bootstrap.sh:ro"
  # Upstream's runtime hotfix suite, vendored at commit 489af95. `extra_mounts`
  # is symmetric with no per-node override, so this directory must exist,
  # identical, on BOTH nodes — the mirror script rsyncs all of ~/utils/lmswitch.
  # A missing/empty mount is fatal in the bootstrap by design: it would
  # otherwise leave one rank serving unpatched vLLM after a clean boot.
  - "~/utils/lmswitch/ai-models/dspark-0731/patches:/opt/dspark-patches:ro"
  # Node-local caches. These must NOT live on the shared NFS export or the two
  # nodes trample each other's artifacts; separate dirs from the v0.25/v0.26
  # lanes so the engines never read each other's.
  - "~/.cache/vllm-dspark-0731-ablit:/root/.cache/vllm"
  - "~/.cache/dspark-0731-ablit-flashinfer:/cache/flashinfer-workspace"
  # FlashInfer/TileLang JIT scratch (upstream's DSPARK_TMP_HOST) — per-node.
  - "~/.cache/dspark-0731-ablit-tmp:/tmp"
  # TileLang compiled-kernel cache. In-image default is ~/.tilelang/cache,
  # which dies with the container and makes every recreate pay JIT again
  # (upstream issue #65). Node-local, like the others.
  - "~/.cache/dspark-0731-ablit-tilelang:/cache/tilelang-cache"

env:
  HF_HUB_OFFLINE: 1
  TRANSFORMERS_OFFLINE: 1
  HF_HUB_DISABLE_XET: 1
  # The checkpoint is bind-mounted at /model, so the upstream HF-cache glob
  # would find nothing. Without this the bootstrap silently no-ops and 0731
  # reasoning-effort / tool-argument semantics are wrong on a clean-looking boot.
  DSPARK_ENCODING_FILE: /model/encoding/encoding_dsv4.py
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
  VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: 256
  # Issue #26: sparsify SWA prefix-cache checkpoints (one tail per 4096-token
  # segment + replay boundary). Load-bearing WITH the #26 v2 coordinator patch
  # — retention is what keeps warm hits large once SWA is allowed to shrink the
  # common hit again. Without the patch this key alone does not fix the 32K+
  # warm-cache collapse.
  # (Both this key and VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS below are
  # registered in this image's envs.py — checked in-image, no unknown-env
  # warning, and the timeout's in-image default really is 300.)
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: 4096
  # Issues #65/#87: a mid-serve CuTeDSL/TileLang JIT can exceed the stock 300s
  # sample_tokens RPC budget and kill EngineCore — on TP=2 that reads exactly
  # like an NCCL wedge. 1800 rides out a worst-case compile; a real hang just
  # surfaces later.
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 1800
  # Read by the #27 hotfix (1-3). Anemll 0.1.1 rejects
  # --max-num-partial-prefills, so this env is the only way to allow more than
  # one in-flight chunked prefill. Upstream's live A/B: 32K x c4 per-stream
  # decode 8.2 -> 24.6 tok/s, 256 x c6 aggregate unchanged.
  # Since upstream #105 the value is parsed once at Scheduler construction, not
  # per admission iteration — keep it an integer, or it silently falls back to
  # max_num_partial_prefills (stock 1) with one warning.
  DSPARK_MAX_INFLIGHT_PREFILLS: 2
  # 1 = one compact scheduler line per step from the #43 patch. Off = no cost.
  DSPARK_ISSUE43_SCHED_DIAG: 0
  # Upstream's shipped default (off / low / high / max), mapped to
  # --default-chat-template-kwargs by the bootstrap. Was hardcoded
  # `{"thinking":false}` here as a local preference; now this lane serves what
  # Mia's recipe serves. Per-request `chat_template_kwargs` still wins. Note
  # that with DSPARK_ENABLE_ISSUE31_GPU_HOTFIX=0 (below, upstream's default)
  # there is NO per-request `thinking_token_budget` escape hatch — a client
  # sending that field gets HTTP 400 — so reasoning length is governed here and
  # by the client's max_tokens.
  # Cost of `max`: ~12.5k reasoning tokens on a moderate prompt upstream. Size
  # client max_tokens in the tens of thousands, or a harness capping at a few
  # hundred gets content: null / finish_reason: length. Set `low` or `off` here
  # if that is the wrong trade for a given client.
  DEFAULT_THINKING: max
  # Client `stop` strings stay dormant inside <think> (harness stops otherwise
  # kill a thinking request mid-reason and return content: null).
  DSPARK_SUPPRESS_STOPS_IN_REASONING: 1
  # #52/#53 assistant-final continuation: upstream default is OFF (stock
  # rendering) since 2026-08-18. Set 1 only deliberately — the patcher is
  # fail-closed and an ON boot that cannot patch refuses to serve.
  DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX: 0
  # #31 v2 GPU thinking_token_budget: upstream default is OFF since 2026-08-22
  # (issue #66) — applying it by default reproduced a decode cliff on requests
  # that omit the field, and every request on this lane omits it. 0 = stock V2
  # sampler; a client sending `thinking_token_budget` gets HTTP 400. Set 1 and
  # recreate the containers only if a client actually needs the field; the
  # patcher is fail-closed, so an ON boot that cannot patch refuses to serve.
  DSPARK_ENABLE_ISSUE31_GPU_HOTFIX: 0
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 0
  VLLM_USE_FLASHINFER_SAMPLER: 1
  # 0, not 1: Anemll 0.1.1 auto-enables breakable graphs for DeepSeek V4 when
  # this key is absent. Opting out keeps regular CUDA graphs (not eager) and is
  # worth +28.6% C1 decode / +13.1% C2 aggregate in upstream's matched probe.
  VLLM_USE_BREAKABLE_CUDAGRAPH: 0
  VLLM_USE_B12X_MOE: 1
  VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: 0
  VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: 16
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  # Targets CuTeDSL kernel compilation at GB10; without it b12x/CuTeDSL may JIT
  # a slower W4A16 fused MoE path mid-inference instead of GB10-native kernels.
  CUTE_DSL_ARCH: sm_121a
  FLASHINFER_DISABLE_VERSION_CHECK: 1
  FLASHINFER_WORKSPACE_BASE: /cache/flashinfer-workspace
  TILELANG_CLEANUP_TEMP_FILES: 1
  # Persist compiled TileLang kernels on the node-local mount above. Upstream
  # puts this on their HF-cache volume; this lane has no HF cache mounted and
  # the cache must stay per-node either way.
  TILELANG_CACHE_DIR: /cache/tilelang-cache
  DG_JIT_USE_NVRTC: 0
  DG_JIT_NVCC_COMPILER: /usr/local/cuda/bin/nvcc
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  NCCL_CROSS_NIC: 1
  NCCL_IGNORE_CPU_AFFINITY: 1
  NCCL_DEBUG: WARN
  NCCL_NVLS_ENABLE: 0
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_IB_ROCE_VERSION_NUM: 2
  # NCCL_NET/IB_DISABLE/IB_HCA/SOCKET_IFNAME/GLOO_SOCKET_IFNAME/TP_SOCKET_IFNAME
  # /IB_GID_INDEX/CUMEM_ENABLE/VLLM_HOST_IP are emitted by the vllm-dual runtime
  # from the `nccl:` block above.

extra_args:
  - "--trust-remote-code"
  - "--pipeline-parallel-size=1"
  - "--kv-cache-dtype=nvfp4_ds_mla"
  - "--block-size=256"
  - "--max-num-batched-tokens=8192"
  # Issue #27 chunk cap: bound one prefill chunk so decode lanes keep leftover
  # budget in the same step. 0 lets a single long prefill eat the whole batch
  # and starves decode to the ~8 tok/s floor.
  - "--long-prefill-token-threshold=1024"
  # max_num_seqs * (MTP + 1) = 6 * 6, upstream's formula. Explicit because the
  # engine default is min(max_num_seqs * 2, 512) = 12 here, which is not this
  # profile's shape. Note the engine then truncates 36 -> 32 (capture sizes end
  # up [1,2,4,8,16,24,32]) and says so at boot; upstream hits the same ceiling,
  # and the util 0.80 headroom is sized for it either way.
  - "--max-cudagraph-capture-size=36"
  - "--enable-prefix-caching"
  # Per-request cached/prefill token breakdown in `usage` — the only reliable
  # way to score prefix-cache behaviour and decode rate (SSE chunk counting
  # undercounts by ~4.5x).
  - "--enable-prompt-tokens-details"
  - "--async-scheduling"
  - "--enable-chunked-prefill"
  # 2026-08-22: the download finished and this is now checked, not carried
  # over. The abliterated config.json is byte-identical to official 0731's
  # (dspark_block_size 5, same quantization_config), 48 shards / 156G, and
  # encoding/encoding_dsv4.py is byte-identical to official 0731's
  # (sha256 abc0d261…) — so the whole serving shape below and the bootstrap's
  # encoder chain apply unchanged. That last check is load-bearing now: the #21
  # patcher edits the checkpoint's own encoder and, since upstream #107, exits
  # nonzero on anchor drift, so a diverging encoder would refuse the boot.
  # k=5 because the checkpoint's dspark_block_size is 5; k<5 silently truncates
  # draft blocks on this image. draft_sample_method is upstream's, not a default.
  # Upstream 2026-08-20 lifted draft_sample_method into a DRAFT_SAMPLE_METHOD
  # env (same "probabilistic" default) so the official model-card pairing
  # k=7 + "greedy" (their issue #84) can be A/B'd without editing compose. Both
  # halves are inline here, so that env is redundant — but the A/B is open and
  # untested on this pair: k=7 does not conflict with the k>=5 floor above.
  - "--speculative-config={\"method\":\"dspark\",\"num_speculative_tokens\":5,\"draft_sample_method\":\"probabilistic\"}"
  - "--tokenizer-mode=deepseek_v4"
  - "--distributed-executor-backend=mp"
  - "--moe-backend=flashinfer_b12x"
  - "--enable-flashinfer-autotune"
  - "--tool-call-parser=deepseek_v4"
  - "--enable-auto-tool-choice"
  - "--reasoning-parser=deepseek_v4"
  - "--reasoning-config={\"reasoning_parser\":\"deepseek_v4\",\"reasoning_start_str\":\"<think>\",\"reasoning_end_str\":\"</think>\"}"
  - "--generation-config=vllm"
